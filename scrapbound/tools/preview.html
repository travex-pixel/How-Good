<!doctype html>
<!-- Renders the share preview (1200x630) and app icon with the game's own art. Used by tools/make-preview.mjs. -->
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<canvas id="icon" width="512" height="512"></canvas>
<script src="../js/data.js"></script><script src="../js/sim.js"></script><script src="../js/render.js"></script>
<script>
const ink = '#1d1a24';
function fighter(ctx, id, x, y, scale, flip) {
  const def = SB.FIGHTERS[id] || SB.ENEMIES[id];
  ctx.save(); ctx.translate(x, y); ctx.scale(scale * (flip ? -1 : 1), scale);
  ctx.globalAlpha = 0.3; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(0, def.r * 1.05, def.r * 1.2, def.r * 0.4, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  SB.BODIES[id](ctx, def.r, { atk: 0.4, hit: 0, special: 0 }, (c) => c, 1.3);
  ctx.restore();
}
function outlined(ctx, text, x, y, size, fill, stroke = 10) {
  ctx.font = `900 ${size}px system-ui, 'Segoe UI', Arial, sans-serif`; ctx.textAlign = 'center';
  ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = ink; ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
function burst(ctx, x, y, r, n, col) {
  ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2, rr = i % 2 ? r * 0.55 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = ink; ctx.stroke();
}
// ---- 1200x630 share card
{
  const c = document.getElementById('og'), ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 630); g.addColorStop(0, '#f6c177'); g.addColorStop(1, '#e98a5b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1200, 630);
  ctx.fillStyle = '#a07d5a'; ctx.fillRect(0, 380, 1200, 250);
  ctx.fillStyle = '#8d6b4b'; for (let i = 0; i < 40; i++) { ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.ellipse((i * 137) % 1200, 400 + (i * 53) % 220, 40, 14, 0, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
  // junk pile skyline
  ctx.fillStyle = '#7a5f45'; ctx.beginPath(); ctx.moveTo(0, 390);
  for (let x = 0; x <= 1240; x += 60) ctx.lineTo(x, 390 - 30 - ((x * 7) % 70)); ctx.lineTo(1200, 390); ctx.fill();
  // magnet + flying junk
  ctx.save(); ctx.translate(1010, 150); ctx.rotate(-0.25);
  ctx.beginPath(); ctx.arc(0, 0, 70, Math.PI, 0); ctx.lineWidth = 46; ctx.strokeStyle = ink; ctx.stroke(); ctx.lineWidth = 38; ctx.strokeStyle = '#d9534f'; ctx.stroke();
  ctx.fillStyle = '#dfe7f2'; ctx.strokeStyle = ink; ctx.lineWidth = 5; ctx.fillRect(-89, -2, 38, 34); ctx.strokeRect(-89, -2, 38, 34); ctx.fillRect(51, -2, 38, 34); ctx.strokeRect(51, -2, 38, 34);
  ctx.restore();
  for (const [x, y, r] of [[870, 250, 18], [930, 300, 14], [1100, 290, 16], [1150, 220, 12], [1000, 330, 20]]) { ctx.save(); ctx.translate(x, y); ctx.fillStyle = '#8c97a3'; ctx.beginPath(); for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, rr = i % 2 ? r : r * 0.7; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.stroke(); ctx.restore(); }
  burst(ctx, 1010, 470, 95, 12, '#ffd84a');
  outlined(ctx, 'KABOOM!', 1010, 488, 44, '#ff5a4f', 9);
  // squad
  fighter(ctx, 'pit', 170, 480, 3.1);
  fighter(ctx, 'knight', 360, 470, 3.3);
  fighter(ctx, 'goblin', 545, 505, 3.0);
  fighter(ctx, 'chimp', 700, 520, 2.6);
  fighter(ctx, 'rat', 860, 545, 2.4, true);
  // title
  outlined(ctx, 'SCRAPBOUND', 440, 150, 104, '#ff9a3a', 18);
  ctx.save(); ctx.translate(440, 215); ctx.rotate(0.04);
  ctx.fillStyle = '#ffd84a'; ctx.strokeStyle = ink; ctx.lineWidth = 6; ctx.beginPath(); ctx.roundRect(-150, -42, 300, 70, 14); ctx.fill(); ctx.stroke();
  ctx.font = '900 50px system-ui, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = ink; ctx.fillText('LOOT RIOT', 0, 10);
  ctx.restore();
  outlined(ctx, 'Smash junk. Grab loot. One more fight...', 440, 305, 36, '#ffffff', 8);
  // play badge
  ctx.fillStyle = '#ff7b2e'; ctx.strokeStyle = ink; ctx.lineWidth = 6; ctx.beginPath(); ctx.roundRect(40, 556, 440, 58, 16); ctx.fill(); ctx.stroke();
  ctx.font = '900 28px system-ui, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = ink; ctx.fillText('PLAY FREE IN YOUR BROWSER', 260, 595);
}
// ---- 512 app icon
{
  const c = document.getElementById('icon'), ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#ffb347'); g.addColorStop(1, '#ff7b2e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
  ctx.beginPath(); ctx.arc(256, 300, 120, Math.PI, 0); ctx.lineWidth = 90; ctx.strokeStyle = ink; ctx.stroke(); ctx.lineWidth = 74; ctx.strokeStyle = '#d9534f'; ctx.stroke();
  ctx.fillStyle = '#dfe7f2'; ctx.strokeStyle = ink; ctx.lineWidth = 8; ctx.fillRect(99, 296, 74, 70); ctx.strokeRect(99, 296, 74, 70); ctx.fillRect(339, 296, 74, 70); ctx.strokeRect(339, 296, 74, 70);
  fighter(ctx, 'knight', 256, 300, 4.2);
}
window.done = true;
</script></body></html>
