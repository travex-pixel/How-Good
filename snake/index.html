<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #111; color: #eee; font-family: system-ui, sans-serif; }
    canvas { background: #1c1c1c; border: 2px solid #333; width: min(90vw, 400px); }
    #hud { display: flex; justify-content: space-between; width: min(90vw, 400px); }
  </style>
</head>
<body>
  <main>
    <div id="hud"><span>Score: <b id="score">0</b></span><span id="status">Arrow keys / WASD / swipe</span></div>
    <canvas id="board" width="400" height="400"></canvas>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
